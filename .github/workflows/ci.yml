# Runs automatically on GitHub every time code is pushed or a PR is opened
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Download the code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install Node.js (with a cache so installs are faster)
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install the exact packages from package-lock.json
      - name: Install dependencies
        run: npm ci

      # 4. Run all tests and check the 65% coverage rule
      - name: Run tests with coverage
        run: npm run coverage

      # 5. Make sure the app builds
      - name: Build the app
        run: npm run build